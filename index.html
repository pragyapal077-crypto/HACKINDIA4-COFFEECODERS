<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Lifeline India | Medical Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex justify-center items-center min-h-screen relative bg-slate-900 overflow-hidden">
    <div id="app-container" class="relative overflow-hidden flex flex-col w-full h-screen bg-slate-50 shadow-2xl sm:max-w-md md:max-w-4xl sm:mx-auto"></div>
    <datalist id="specialties-list">
        <option value="General Physician">
        <option value="Cardiologist">
        <option value="Neurologist">
        <option value="Orthopedic Surgeon">
        <option value="Pediatrician">
        <option value="Gynecologist">
        <option value="Dermatologist">
        <option value="Emergency Specialist">
        <option value="Pulmonologist">
        <option value="Gastroenterologist">
    </datalist>
    <div id="ai-modal-root"></div>
    <script type="module" src="app.js"></script>
</body>
</html>
